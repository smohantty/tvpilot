[package]
name = "tvpilot"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
zbus = { version = "5", features = ["blocking-api"] }
base64 = "0.22"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
